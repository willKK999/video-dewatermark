<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频去水印 · 操作台</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172b38;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:40px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}h1{font-size:27px;margin:8px 0}h2{font-size:19px;margin:0 0 18px}p{line-height:1.8;color:#536975}small{color:#647580}section,.card{background:white;border:1px solid #e0e8ec;border-radius:16px;padding:26px;margin:20px 0;box-shadow:0 4px 20px #18354405}button,.download{border:0;border-radius:9px;background:#087d71;color:white;padding:12px 20px;cursor:pointer;font:inherit;display:inline-block;text-decoration:none}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#eaf1f3;color:#263e4c}input{padding:13px;border:1px solid #cbd9df;border-radius:8px;font:inherit;max-width:100%}input[type=password]{width:400px}.fileSelect{width:100%;background:#f7fafb;margin-bottom:16px;padding:13px;border:1px solid #cbd9df;border-radius:8px;display:flex;align-items:center;gap:16px;overflow-wrap:anywhere}progress{width:100%;height:18px;margin:15px 0}#notice{color:#a03627;white-space:pre-wrap}#login{max-width:630px;margin:60px auto}.topline{font-size:13px;color:#087d71;letter-spacing:2px}.row{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.badge{background:#e8f5ef;color:#176f56;border-radius:30px;padding:6px 13px;font-size:14px}.details{font-size:14px;color:#647580;margin:14px 0;overflow-wrap:anywhere}.videos{display:grid;grid-template-columns:1fr 1fr;gap:18px}video{width:100%;background:#162b34;border-radius:10px;max-height:360px}.filename{font-weight:650;overflow-wrap:anywhere}.error{color:#a03627;white-space:pre-wrap}.empty{text-align:center;padding:30px;color:#647580}[hidden]{display:none!important}@media(max-width:650px){main{padding:20px 14px}.videos{grid-template-columns:1fr}section,.card{padding:20px}h1{font-size:23px}}
</style>
<main><header><div><div class="topline">视频处理工作台</div><h1>让画面回归干净</h1><small>自动识别水印，无需手动画框</small></div><button id="logout" class="secondary" hidden>退出登录</button></header>
<div id="notice" role="alert" aria-live="polite"></div>
<section id="login"><h2>登录操作台</h2><p>请输入专用访问令牌。令牌只保存在当前标签页的会话中，退出后清除。</p><form id="loginForm"><input id="token" type="password" autocomplete="off" placeholder="访问令牌" aria-label="访问令牌" required> <button>登录</button></form></section>
<div id="workspace" hidden><section><h2>上传视频</h2><p>单条不超过 <b>30 秒</b>、<b>200 MiB</b>。支持 <b>H.264 8-bit 4:2:0 MP4/MOV</b>，上传后会再次检查编码格式。</p><form id="uploadForm"><div class="fileSelect"><input id="file" type="file" accept=".mp4,.mov,video/mp4,video/quicktime" hidden aria-label="选择视频"><button id="chooseFile" type="button" class="secondary">选择视频</button><span id="chosenFilename">尚未选择视频</span></div><div class="row"><small>建议先用短视频试跑，处理期间可保留页面查看进度。</small><button id="submit">上传并去水印</button></div></form><progress id="progress" value="0" max="100" hidden></progress><div id="uploadStatus" role="status" aria-live="polite"></div></section><div class="row"><h2>我的任务 <small>最近 100 条</small></h2><button id="refresh" class="secondary">刷新列表</button></div><div id="jobs"></div></div>
</main><script>
let token=sessionStorage.getItem('consoleToken')||'', timer, busy=false;
const $=id=>document.getElementById(id), urls=new Map();
const states={QUEUED:'排队中',RUNNING:'运行中',SUCCEEDED:'成功',NEEDS_REVIEW:'需要复核',FAILED:'失败',CANCEL_REQUESTED:'正在取消',CANCELED:'已取消'};
const stages={probe:'检查视频',detect:'识别水印',mask:'生成遮罩',inpaint:'修复画面',encode:'编码视频',publish:'发布成品'};
const messages={UNAUTHORIZED:'令牌无效或已失效，请重新登录。',QUOTA_EXCEEDED:'当前等待处理的任务较多，请稍后再试。',UPLOAD_TOO_LARGE:'视频不能超过 200 MiB。',UPLOAD_EXPIRED:'上传已过期，请重新上传。',NOT_CANCELABLE:'任务已结束，无法取消。',STORAGE_UNAVAILABLE:'视频存储暂时不可用，请稍后重试。',SERVICE_UNAVAILABLE:'服务暂时不可用，请稍后重试。',DATABASE_UNAVAILABLE:'任务服务暂时不可用，请稍后重试。',UPLOAD_INVALID:'上传不完整或文件信息不匹配，请重新上传。'};
const failureMessages={INVALID_MEDIA:'视频格式、编码或媒体参数不符合当前限制，请先转换视频。',GPU_OOM:'显存不足，请稍后重试或使用更低分辨率的视频。',STORAGE_UNAVAILABLE:'处理期间存储访问失败，请重试。',PROCESS_TIMEOUT:'处理步骤超时，请稍后重试。',PROCESS_FAILED:'视频处理步骤执行失败，请联系管理员检查。',OUTPUT_INVALID:'成品校验未通过，未发布成品。',MASK_INVALID:'水印遮罩不符合要求，需要人工检查。',MODEL_INVALID:'模型校验失败，请联系管理员检查。',INTERNAL_ERROR:'处理服务发生内部错误，请联系管理员检查。',LEASE_EXPIRED:'处理进程失去响应，服务将按重试策略处理。',CANCELED:'任务已取消。'};
function failureReason(e){return failureMessages[e.code]||e.message||'处理未完成，请联系管理员检查。'}
function notice(e){$('notice').textContent=e?.message||String(e||'')}
async function api(path,options={}){let r;try{r=await fetch(path,{...options,headers:{Authorization:'Bearer '+token,...options.headers}})}catch{throw Error('网络连接失败，请检查连接后重试。')}if(!r.ok){let b=await r.json().catch(()=>({}));if(r.status===401)logout();throw Error(messages[b.error?.code]||(b.error?.code==='UNSUPPORTED_VIDEO'?b.error.message:'请求未完成，请刷新后重试。'))}return r}
function revoke(){for(const u of urls.values())URL.revokeObjectURL(u);urls.clear()}
function logout(){clearTimeout(timer);token='';sessionStorage.removeItem('consoleToken');$('token').value='';$('login').hidden=false;$('workspace').hidden=true;$('logout').hidden=true;$('jobs').replaceChildren();revoke()}
async function login(){clearTimeout(timer);await api('/v1/jobs');sessionStorage.setItem('consoleToken',token);$('token').value='';$('login').hidden=true;$('workspace').hidden=false;$('logout').hidden=false;await refresh()}
$('loginForm').onsubmit=async e=>{e.preventDefault();token=$('token').value.trim();try{notice('');await login()}catch(e){notice(e)}};
$('logout').onclick=logout;
function node(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function elapsed(j){let end=['QUEUED','RUNNING','CANCEL_REQUESTED'].includes(j.status)?Date.now():Date.parse(j.updated_at);return Math.max(0,Math.round((end-Date.parse(j.created_at))/1000))+' 秒'}
async function comparison(j,container,button){container.dataset.mediaLoading='true';button.disabled=true;button.textContent='正在载入视频…';try{const grid=node('div',null,'videos');for(const [kind,label] of [['source','原片'],['result','去水印成品']]){const key=j.id+kind;let u=urls.get(key);if(!u){const r=await api('/v1/jobs/'+j.id+'/media/'+kind);u=URL.createObjectURL(await r.blob());urls.set(key,u)}const box=node('div');box.append(node('p',label));const v=node('video');v.controls=true;v.preload='metadata';v.src=u;box.append(v);if(kind==='result'){const a=node('a','下载成品','download');a.href=u;a.download='去水印成品.mp4';box.append(a)}grid.append(box)}container.append(grid);button.remove()}catch(e){button.disabled=false;button.textContent='播放对比与下载';notice(e)}finally{delete container.dataset.mediaLoading}}
async function refresh(){clearTimeout(timer);if(!token)return;try{const data=await(await api('/v1/jobs')).json();const root=$('jobs');root.querySelector('.empty')?.remove();const keep=new Set();for(const {job:j,filename} of data.items){keep.add(j.id);let card=document.getElementById(j.id);if(!card){card=node('article',null,'card');card.id=j.id;root.append(card)}root.append(card);const hasVideo=!!card.querySelector('video')||card.dataset.mediaLoading==='true';if(hasVideo)continue;card.replaceChildren();const row=node('div',null,'row');row.append(node('div',filename,'filename'),node('span',states[j.status]||'状态更新中','badge'));card.append(row,node('div','创建于 '+new Date(j.created_at).toLocaleString('zh-CN')+' · 总耗时 '+elapsed(j)+(j.stage?' · '+(stages[j.stage]||'处理中'):''),'details'));if(j.error){card.append(node('p','原因：'+failureReason(j.error),'error'))}if(['QUEUED','RUNNING'].includes(j.status)){const b=node('button','取消任务','secondary');b.onclick=async()=>{b.disabled=true;try{await api('/v1/jobs/'+j.id+'/cancel',{method:'POST'});await refresh()}catch(e){notice(e);b.disabled=false}};card.append(b)}if(j.status==='NEEDS_REVIEW')card.append(node('p','自动质检未通过，需要人工复核；暂不提供成品。'));if(j.status==='SUCCEEDED'){if(j.result?.expired)card.append(node('p','成品已过期，请重新提交视频。'));else{const b=node('button','播放对比与下载');b.onclick=()=>comparison(j,card,b);card.append(b)}}}for(const c of [...root.children])if(c.id&&!keep.has(c.id))c.remove();if(!data.items.length)root.replaceChildren(node('div','还没有任务，上传一段视频开始吧。','empty'))}catch(e){notice(e)}finally{if(token)timer=setTimeout(refresh,4000)}}
$('refresh').onclick=refresh;
$('chooseFile').onclick=()=>$('file').click();
$('file').onchange=()=>{$('chosenFilename').textContent=$('file').files[0]?.name||'尚未选择视频'};
function duration(file){return new Promise((resolve,reject)=>{const v=document.createElement('video'),u=URL.createObjectURL(file);const finish=(e)=>{clearTimeout(timeout);v.removeAttribute('src');v.load();URL.revokeObjectURL(u);e?reject(e):resolve(vDuration)};let vDuration;const timeout=setTimeout(()=>finish(Error('读取视频超时，请检查文件。')),15000);v.onloadedmetadata=()=>{vDuration=v.duration;finish()};v.onerror=()=>finish(Error('浏览器无法读取此视频，请转换为 H.264 MP4 后重试。'));v.preload='metadata';v.src=u})}
function upload(id,file,ct){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('PUT','/v1/uploads/'+id+'/content');x.setRequestHeader('Authorization','Bearer '+token);x.setRequestHeader('Content-Type',ct);x.timeout=600000;x.upload.onprogress=e=>{if(e.lengthComputable){const n=Math.round(e.loaded/e.total*100);$('progress').value=n;$('uploadStatus').textContent=n===100?'上传完成，正在检查编码并保存视频…':'正在上传 '+n+'%'}};x.onload=()=>{if(x.status===200)resolve();else{let b={};try{b=JSON.parse(x.responseText)}catch{}reject(Error(messages[b.error?.code]||b.error?.message||'上传失败，请重试。'))}};x.onerror=()=>reject(Error('上传连接中断，请重试。'));x.ontimeout=()=>reject(Error('上传超时，请重试。'));x.send(file)})}
$('uploadForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const file=$('file').files[0];if(!file){notice(Error('请先选择一个视频。'));return}busy=true;$('submit').disabled=true;notice('');try{if(!/\.(mp4|mov)$/i.test(file.name))throw Error('请选择 MP4 或 MOV 视频。');if(!file.size||file.size>200*1024*1024)throw Error('视频大小须大于零且不超过 200 MiB。');$('uploadStatus').textContent='正在检查视频…';const d=await duration(file);if(!Number.isFinite(d)||d<=0||d>30)throw Error('单条视频不能超过 30 秒，请先剪辑后再上传。');const ct=/\.mov$/i.test(file.name)?'video/quicktime':'video/mp4';const up=await(await api('/v1/uploads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,size_bytes:file.size,content_type:ct})})).json();$('progress').hidden=false;$('progress').value=0;await upload(up.upload_id,file,ct);$('uploadStatus').textContent='正在提交去水印任务…';await api('/v1/jobs',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':up.upload_id},body:JSON.stringify({upload_id:up.upload_id,options:{max_short_edge:720,allow_downgrade:true}})});$('uploadStatus').textContent='任务已提交，将自动更新处理状态。';$('file').value='';$('chosenFilename').textContent='尚未选择视频';await refresh()}catch(e){notice(e);$('uploadStatus').textContent='未提交成功，请检查提示后重试。'}finally{busy=false;$('submit').disabled=false;$('progress').hidden=true}};
if(token)login().catch(notice);
</script></html>
