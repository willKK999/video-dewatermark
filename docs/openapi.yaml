openapi: 3.0.3
info:
  title: 视频去水印系统 API
  version: mvp-1
servers:
  - url: http://localhost:8080/v1
security:
  - bearerAuth: []
paths:
  /uploads:
    post:
      summary: 申请私有对象上传地址
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, size_bytes, content_type]
              properties:
                filename: {type: string, maxLength: 255}
                size_bytes: {type: integer, minimum: 1, maximum: 209715200}
                content_type: {type: string, enum: [video/mp4, video/quicktime]}
      responses:
        '201':
          description: 客户端按 required_headers 直接 PUT 到 put_url
          content:
            application/json:
              schema:
                type: object
                required: [upload_id, put_url, required_headers, expires_at]
                properties:
                  upload_id: {type: string}
                  put_url: {type: string, format: uri}
                  required_headers: {type: object, additionalProperties: {type: string}}
                  expires_at: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Error'}
  /jobs:
    post:
      summary: 创建异步处理任务（相同租户、同键同体返回原任务）
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - required: [upload_id]
                - required: [hls_input]
              properties:
                upload_id: {type: string}
                hls_input: {type: string, maxLength: 4096, description: 当前租户的 R2 m3u8 对象键或公开 HTTP/HTTPS 链接，与 upload_id 二选一}
                options: {$ref: '#/components/schemas/Options'}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '409': {description: 同键请求体不一致}
        default: {$ref: '#/components/responses/Error'}
  /jobs/{id}:
    parameters:
      - {$ref: '#/components/parameters/JobID'}
    get:
      summary: 查询状态；成功结果生成十分钟有效的下载链接
      responses:
        '200': {$ref: '#/components/responses/Job'}
        default: {$ref: '#/components/responses/Error'}
  /jobs/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/JobID'}
    post:
      summary: 发起取消；重复取消返回已有状态
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '409': {description: 已进入不可取消终态}
        default: {$ref: '#/components/responses/Error'}
  /jobs/{id}/retry:
    parameters:
      - {$ref: '#/components/parameters/JobID'}
    post:
      summary: 重试失败的 HLS 未完成块，复用已完成块检查点，累计至多三次执行
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '409': {description: 状态或尝试次数不允许重试}
        default: {$ref: '#/components/responses/Error'}
  /jobs/{id}/hls/{name}:
    parameters:
      - {$ref: '#/components/parameters/JobID'}
      - {in: path, name: name, required: true, schema: {type: string}, description: index.m3u8 或六位数字 ts 文件名}
    get:
      summary: 读取同源 HLS 播放列表或分片，每次请求均需身份凭证
      responses:
        '200': {description: 播放列表或 MPEG-TS 视频分片}
        default: {$ref: '#/components/responses/Error'}
  /jobs/{id}/media/{kind}:
    parameters:
      - {$ref: '#/components/parameters/JobID'}
      - {in: path, name: kind, required: true, schema: {type: string, enum: [source, result, bundle]}}
    get:
      summary: 读取原片 MP4、成品 MP4 或 HLS ZIP 包，支持范围请求
      responses:
        '200': {description: 媒体或打包文件}
        '206': {description: 指定范围内容}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    JobID: {in: path, name: id, required: true, schema: {type: string}}
  responses:
    Job:
      description: 任务状态；异步失败仍返回 HTTP 200，查看 status 和 error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Job'}
    Error:
      description: 400 参数、401 鉴权、404 无权/不存在、409 冲突、413 超限、422 上传无效、429 配额、503 暂不可用
      content:
        application/json:
          schema:
            type: object
            required: [error, request_id]
            properties:
              request_id: {type: string}
              error: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
    Options:
      type: object
      additionalProperties: false
      properties:
        hls_bandwidth: {type: integer, minimum: 0, default: 0, description: 主播放列表码率上限 bit/s；0 选择最高码率}
        hls_native_path: {type: string, enum: [speedup-v2, v7], description: 仅整集有效；省略时遵循工作进程默认；七版回退仍保持原生六十帧交付}
        hls_encoder: {type: string, enum: [libx264, h264_nvenc], description: 仅整集有效；显卡编码需独立画质对照；七版回退固定使用软件编码}
        max_short_edge: {type: integer, enum: [720, 540], default: 720}
        allow_downgrade: {type: boolean, default: false}
        prompts:
          type: array
          description: 归一视频中从0起的帧号和像素框；复核重跑需创建新任务
          items:
            type: object
            required: [frame, box]
            properties:
              frame: {type: integer, minimum: 0, maximum: 899}
              box:
                type: array
                minItems: 4
                maxItems: 4
                items: {type: number, minimum: 0, maximum: 1280}
    Job:
      type: object
      required: [id, status, stage, attempt, pipeline_version, created_at, updated_at, result, error]
      properties:
        id: {type: string}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, NEEDS_REVIEW, CANCEL_REQUESTED, CANCELED]}
        stage: {type: string, nullable: true, enum: [probe, detect, mask, inpaint, encode, publish, null]}
        attempt: {type: integer, minimum: 0, maximum: 3}
        pipeline_version: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        progress:
          type: object
          properties:
            current_chunk: {type: integer, minimum: 1}
            total_chunks: {type: integer, minimum: 1}
            phase: {type: string, enum: [probe, detect, mask, inpaint, encode, quality, publish]}
        result:
          type: object
          nullable: true
          properties:
            hls: {type: boolean}
            native_path: {type: string, enum: [speedup-v2, v7]}
            quality_review_required: {type: boolean}
            chunk_count: {type: integer}
            audio_copy_verified: {type: boolean}
            residual_count: {type: integer}
            expired: {type: boolean}
            download_url: {type: string, format: uri}
            expires_at: {type: string, format: date-time}
            width: {type: integer}
            height: {type: integer}
            duration_ms: {type: integer}
            frame_count: {type: integer}
            fps: {type: number}
            engine: {type: string}
            downgraded: {type: boolean}
        error:
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/Error'}
